<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>File Vault</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset="1" stop-color="#1d1440"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.9" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- The tile: deep navy to violet, a faint dot grid, a hairline edge. -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#dots)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>
  <circle cx="128" cy="128" r="92" fill="url(#halo)"/>

  <!-- The mark from the bar (Logo.qml) on its 16-unit grid, scaled up:
       a hexagonal vault cut open at the upper right, a dial ring, a core. -->
  <g transform="translate(40 40) scale(11)" fill="none" stroke-linecap="round" stroke-linejoin="round"
     filter="url(#glow)">
    <path d="M 11.4 2.95 L 14.06 4.5 L 14.06 11.5 L 8 15 L 1.94 11.5 L 1.94 4.5 L 8 1 L 9.3 1.75"
          stroke="url(#edge)" stroke-width="1.1"/>
    <path d="M 8 4.9 A 3.1 3.1 0 1 1 4.9 8" stroke="url(#edge)" stroke-width="0.95"/>
    <circle cx="8" cy="8" r="1.35" fill="url(#core)" stroke="none"/>
  </g>

</svg>
